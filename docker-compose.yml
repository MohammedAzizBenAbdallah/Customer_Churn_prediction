version: '3.8'

services:
  # --- 1. Your FastAPI Application ---
  churn_api:
    build: .  # Build the image from the Dockerfile in this directory
    container_name: churn_api
    ports:
      - "8000:8000" # Expose port 8000 to your host machine

  # --- 2. The Prometheus Monitoring Server ---
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090" # Expose Prometheus's web UI
    volumes:
      # Mount your config file into the container
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command: '--config.file=/etc/prometheus/prometheus.yml'

  # --- 3. The Grafana Dashboard ---
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000" # Expose Grafana's web UI
    depends_on:
      - prometheus # Don't start Grafana until Prometheus is ready